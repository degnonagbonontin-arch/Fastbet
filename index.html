<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fastbet - Gestion des opérations</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 24px 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 14px;
      color: #cbd5e1;
    }

    main {
      padding: 20px;
    }

    .welcome {
      background: linear-gradient(135deg, #0b1f3a, #174b78);
      color: white;
      border-radius: 18px;
      padding: 25px 20px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 10px;
      font-size: 21px;
    }

    .welcome p {
      font-size: 14px;
      line-height: 1.5;
    }

    .balance {
      margin-top: 20px;
      background: rgba(255,255,255,0.12);
      padding: 15px;
      border-radius: 12px;
    }

    .balance span {
      display: block;
      font-size: 13px;
      color: #dbeafe;
    }

    .balance strong {
      display: block;
      margin-top: 5px;
      font-size: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e4e8ee;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .info {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7dce3;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus,
    select:focus {
      border-color: #174b78;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .deposit {
      background: #0b1f3a;
      color: white;
    }

    .withdraw {
      background: #eef2f6;
      color: #0b1f3a;
      border: 1px solid #d8dee8;
    }

    button:active {
      transform: scale(0.98);
    }

    .history {
      list-style: none;
    }

    .history li {
      display: flex;
      justify-content: space-between;
      align-items: center;
