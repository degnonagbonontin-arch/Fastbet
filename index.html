<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fastbet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #ffffff;
    }

    header {
      padding: 20px;
      background: #071a36;
      color: white;
      border-radius: 0 0 24px 24px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .welcome {
      margin-top: 28px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #cbd5e1;
    }

    .balance {
      margin-top: 25px;
      background: #102c55;
      padding: 20px;
      border-radius: 18px;
    }

    .balance small {
      color: #cbd5e1;
    }

    .balance strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
    }

    .action {
      padding: 18px 10px;
      border: 0;
      border-radius: 15px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .deposit {
      background: #0d6efd;
      color: white;
    }

    .withdraw {
      background: #e9eef5;
      color: #111827;
    }

    .section {
      padding: 0 20px 25px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .methods {
      display: grid;
      gap: 12px;
    }

    .method {
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: white;
      font-weight: bold;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 13px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    nav a {
      text-align: center;
      text-decoration: none;
      color: #64748b;
      font-size: 13px;
    }

    nav span {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Fastbet</div>

    <div class="welcome">
      <h1>Bienvenue 👋</h1>
      <p>Gérez vos opérations simplement.</p>
    </div>

    <div class="balance">
      <small>Votre solde</small>
      <strong>0 FCFA</strong>
    </div>
  </header>

  <div class="actions">
    <button class="action deposit">Faire un dépôt</button>
    <button class="action withdraw">Faire un retrait</button>
  </div>

  <section class="section">
    <h2>Moyens de paiement</h2>

    <div class="methods">
      <div class="method">📱 MTN MoMo</div>
      <div class="method">📱 Moov Money</div>
      <div class="method">📱 Celtiis Money</div>
    </div>
  </section>

</div>

<nav>
  <a href="#">
    <span>⌂</span>
    Accueil
  </a>

  <a href="#">
    <span>＋</span>
    Dépôt
  </a>

  <a href="#">
    <span>↗</span>
    Retrait
  </a>
</nav>

</body>
</html>
